services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_profiler
      POSTGRES_USER: ai_profiler
      POSTGRES_PASSWORD: ai_profiler
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_profiler -d ai_profiler"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ai-profiler-postgres:/var/lib/postgresql/data

  report-loader:
    build: .
    command:
      - bun
      - run
      - import-report
      - --report
      - /app/reports_system/three_fp_v39/system_lineage.json
    environment:
      DATABASE_URL: postgres://ai_profiler:ai_profiler@postgres:5432/ai_profiler
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./reports_system:/app/reports_system:ro

  ui:
    build: .
    environment:
      DATABASE_URL: postgres://ai_profiler:ai_profiler@postgres:5432/ai_profiler
      UI_HOST: 0.0.0.0
      UI_PORT: 8093
    ports:
      - "8093:8093"
    depends_on:
      report-loader:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./reports_system:/app/reports_system:ro

volumes:
  ai-profiler-postgres:
